name: DocGenPro Windows installer

on:
  push:
    branches: [main]
    paths:
      - 'docgen-electron/**'
      - '.github/workflows/docgen-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docgen-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: docgen-electron
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docgen-electron/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docgen-electron/requirements-build.txt

      - name: Install dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-build.txt

      - name: Build Python backend
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile
          --distpath resources/bin --workpath build/python --specpath build/python
          --name main3 main3.py

      - name: Build Electron installer
        run: npm run build -- --win nsis --x64 --publish never

      - name: Verify packaged backend and document generation
        run: python scripts/smoke-test.py

      - name: Record installer checksum
        run: |
          $installers = @(Get-ChildItem dist_setup -Filter '*.exe' -File)
          if ($installers.Count -eq 0) { throw 'No installer was generated' }
          $lines = $installers | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content dist_setup/SHA256SUMS.txt -Encoding utf8
          "Download the Windows x64 installer from the **DocGenPro-Windows-x64** artifact below. No Node.js or Python installation is required." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DocGenPro-Windows-x64
          path: |
            docgen-electron/dist_setup/*.exe
            docgen-electron/dist_setup/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
